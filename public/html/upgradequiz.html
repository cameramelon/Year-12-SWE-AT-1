<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta
            http-equiv="Content-Security-Policy"
            content="script-src 'self';"
        />
        <link rel="stylesheet" href="../css/upgradequiz.css" />
        <title>The Bloons Hub - Upgrade Quiz</title>
        <link rel="manifest" href="../json/manifest.json" />
        <link rel="icon" type="image/x-icon" href="../images/favicon.png" />
    </head>
    <body>
        <main>
            <nav>
                <h1 id="title">THE UPGRADE QUIZ</h1>
                <h3>Can you name every upgrade?</h3>
            </nav>
            <div class="textbox">
                <p>Enter here:</p>
                <textarea id="input" name="input" rows="1" cols="50"></textarea>
                <p id="timer"></p>
                <p id="count"></p>
            </div>
            <div class="winscreen" id="winscreen">
                <h2>YOU WIN!</h2>
                <p id="finalTimer">Final Time: 0</p>
                <p id="upgradeTime">Time/upgrade: 0</p>
            </div>
            <div class="container-quiz"></div>
            <script src="../js/upgradequiz.js"></script>
        </main>
    </body>
</html>
